services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: neo
      POSTGRES_PASSWORD: genesis
      POSTGRES_DB: neogenesis
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
